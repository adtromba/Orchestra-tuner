<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sound test (beta)</title>
<style>
:root {
  /* Layout: one centered column. Mode tabs, shared setup, then either the drone or the tuner. */
  --bg: #eef0ed;
  --surface: #ffffff;
  --ink: #17211e;
  --muted: #5d6b66;
  --line: #d3d9d5;
  --accent: #0f6b5c;
  --accent-ink: #ffffff;
  --good: #1f8a4c;
  --warn: #b45f06;
  --font-display: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  --font-body: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1614; --surface: #17211e; --ink: #e6ede9; --muted: #8fa19a;
    --line: #2b3a35; --accent: #4fc2a9; --accent-ink: #07211b;
    --good: #5bd48a; --warn: #f0a04b;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1614; --surface: #17211e; --ink: #e6ede9; --muted: #8fa19a;
  --line: #2b3a35; --accent: #4fc2a9; --accent-ink: #07211b;
    --good: #5bd48a; --warn: #f0a04b;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.4; -webkit-tap-highlight-color: transparent; }
main { max-width: 480px; margin: 0 auto; padding: 20px 16px 48px; display: flex; flex-direction: column; gap: 16px; }
h1 { font-size: 13px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0; }
button:focus-visible, input:focus-visible, select:focus-visible, summary:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 16px; }
.row { display: flex; flex-direction: column; gap: 8px; }
.label { display: flex; justify-content: space-between; align-items: baseline; font-size: 14px; font-weight: 600; }
.label output { font-family: var(--font-display); font-weight: 400; color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }
.hint { margin: 0; font-size: 13px; color: var(--muted); }

select { width: 100%; min-height: 48px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--ink); font: 500 16px var(--font-body); padding: 0 12px; }

.seg { display: flex; gap: 6px; }
.seg button { flex: 1 1 0; min-height: 44px; border: 1px solid var(--line); border-radius: 10px; background: transparent; color: var(--ink); font: 500 15px var(--font-body); cursor: pointer; padding: 0 4px; }
.seg button[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }


.big { font: 700 40px var(--font-body); text-align: center; min-height: 48px; }
.prompt { font: 600 22px var(--font-body); text-align: center; }
.meter { position: relative; height: 28px; border-radius: 14px; background: var(--bg); border: 1px solid var(--line); overflow: hidden; }
.meter .fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: var(--muted); transition: width .1s linear; }
.meter.ok .fill { background: var(--good); }
.meter .mark { position: absolute; top: 0; bottom: 0; width: 3px; background: var(--ink); opacity: .7; }
.cents { text-align: center; font: 400 16px var(--font-display); color: var(--muted); min-height: 22px; }
.v-ok { color: var(--good); } .v-warn { color: var(--warn); }
.btn { min-height: 52px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); font: 600 17px var(--font-body); cursor: pointer; padding: 0 12px; width: 100%; }
.btn.main { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.btn[disabled] { opacity: .4; cursor: default; }
.wrap { display: flex; flex-wrap: wrap; gap: 6px; }
.wrap .btn { flex: 1 1 40%; min-height: 46px; font-size: 15px; }
details summary { cursor: pointer; font-weight: 600; min-height: 44px; display: flex; align-items: center; }
.kv { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; font: 400 15px var(--font-display); }
.tbl { overflow-x: auto; }
table { border-collapse: collapse; font: 400 12px var(--font-display); width: 100%; }
th, td { border-bottom: 1px solid var(--line); padding: 4px 6px; text-align: right; white-space: nowrap; }
th:first-child, td:first-child { text-align: left; }
.note { color: var(--warn); font-size: 13px; margin: 0; }

[hidden] { display: none !important; }
.needle { position: absolute; top: 0; bottom: 0; width: 4px; margin-left: -2px; background: var(--ink); left: 50%; transition: left .1s linear, opacity .2s; }
.band { position: absolute; top: 0; bottom: 0; background: var(--good); opacity: .55; }
.scale { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); margin-top: -8px; }
.calbig { font: 700 26px var(--font-body); text-align: center; min-height: 64px; }
.hold .fill { background: var(--accent); }
</style>
</head>
<body>
<main>
  <h1>Sound test (beta) <span id="ver">v2a</span></h1>
  <section class="card">
    <div id="calBox" class="row" style="gap:14px">
      <div class="calbig" id="calText">Tap Start listening</div>
      <div class="meter hold" id="hold"><div class="fill" id="holdFill"></div></div>
      <div class="cents" id="calSub"></div>
      <div class="wrap" id="calBtns"></div>
    </div>
    <div id="prac" class="row" style="gap:14px" hidden>
      <div class="prompt">Play written G</div>
      <div class="meter" id="meter" role="meter" aria-label="Flat to pinched"><div class="band" id="band"></div><div class="needle" id="needle"></div></div>
      <div class="scale"><span>flat</span><span>pinched</span></div>
      <div class="big" id="verdict" aria-live="polite"></div>
      <div class="cents" id="cents"></div>
    </div>
    <div class="wrap">
      <button class="btn main" id="go">Start listening</button>
      <button class="btn" id="recal" disabled>Recalibrate</button>
    </div>
    <p class="note" id="agcNote" hidden></p>
    <p class="hint" id="msg"></p>
    <details>
      <summary>Details</summary>
      <div class="kv">
        <span>FUND_SHARE (dB)</span><span id="dFund">–</span>
        <span>pos</span><span id="dPos">–</span>
        <span>Cents</span><span id="dCents">–</span>
        <span>LEVEL (dBFS)</span><span id="dLevel">–</span>
        <span>P pinched</span><span id="dP">–</span>
        <span>F flat</span><span id="dF">–</span>
        <span>C centered</span><span id="dC">–</span>
        <span>Noise (dBFS)</span><span id="dNoise">–</span>
      </div>
      <div class="row" style="margin-top:12px">
        <div class="label">Orchestra A</div>
        <div class="seg" id="refSeg" role="group" aria-label="Orchestra A in hertz">
          <button data-v="415" aria-pressed="false">415</button>
          <button data-v="440" aria-pressed="true">440</button>
          <button data-v="442" aria-pressed="false">442</button>
          <button data-v="443" aria-pressed="false">443</button>
        </div>
      </div>
    </details>
  </section>

  <section class="card">
    <button class="btn" id="save" disabled>Save this note</button>
    <div id="ask" hidden>
      <div class="label" style="margin-bottom:8px">What were you playing?</div>
      <div class="wrap" id="labels">
        <button class="btn" data-l="Balanced">Balanced</button>
        <button class="btn" data-l="Flat">Flat</button>
        <button class="btn" data-l="Pinched">Pinched</button>
        <button class="btn" data-l="Slightly flat">Slightly flat</button>
        <button class="btn" data-l="Slightly pinched">Slightly pinched</button>
      </div>
    </div>
    <div class="tbl"><table id="tbl"><thead><tr><th>#</th><th>label</th><th>verdict</th><th>fund</th><th>pos</th><th>cents</th><th>level</th></tr></thead><tbody></tbody></table></div>
    <div class="wrap">
      <button class="btn" id="copy">Copy all as CSV</button>
      <button class="btn" id="dl">Download CSV</button>
      <button class="btn" id="clear">Clear</button>
    </div>
  </section>
  <p class="hint" id="buildTag" style="text-align:center;opacity:.6">Sound test v2a</p>
</main>
<script>
(function () {
  'use strict';
  // ---------- constants (tune these) ----------
  var VERSION = 'v2a';
  var TARGET_HZ = 349.23;        // written G4 on B-flat trumpet = concert F4 at A=440
  var PEAK_RANGE_CENTS = 100;    // f0 = largest FFT peak within this of target
  var PEAK_PROM_DB = 15;         // that peak must stand this far above the local spectrum median
  var LOCAL_HALF_HZ = 100;       // half-width of the local median for the prominence check
  var LEVEL_MIN_DBFS = -55;      // quiet below this
  var NOISE_MARGIN_DB = 10;      // also must be this far above the calibrated noise level
  var NOISE_MAX_DBFS = -40;      // calibration noise louder than this = too noisy
  var WINDOW = 32768;            // samples analysed
  var PAD_FACTOR = 4;            // zero-pad FFT
  var ANALYSIS_MS = 100;
  var SMOOTH_N = 5;              // median of last N values
  var FUND_BAND = 0.1;           // fundamental band +-10%
  var TOT_LO = 40, TOT_HI = 12000;
  var HK_BAND = 0.03;            // +-3% around k*f0 for hk
  var SILENT_S = 3;              // calibration: silence length
  var HOLD_S = 4;                // calibration: each note held this long
  var STEADY_S = 2;              // steadiest stretch used
  var FLUSH_S = 0.7;             // ignore this long after each step starts (old audio still in the window)
  var HOLD_GRACE_MS = 400;       // a gap shorter than this does not reset the hold
  var MIN_SPAN = 8;              // dB, P - F must be at least this
  var CENTER_OK_LO = 0.30, CENTER_OK_HI = 0.70;
  var CENTER_ZONE = 0.13;        // green band = CENTER +- this
  var NEEDLE_MIN = -0.25, NEEDLE_MAX = 1.25;
  var WORD_HOLD = 1.0;           // seconds a new state must hold before the word changes
  var WORDS = { centered: 'Centered', flat: 'Aim higher', pinched: 'Aim lower' };
  var TXT = {
    idle: 'Tap Start listening. First a quick calibration, about 30 seconds.',
    silent: 'Stay silent',
    pinched: 'Play G pinched — thin, sitting high.',
    flat: 'Play G flat — full, no sparkle, sitting low.',
    centered: 'Play G centered — your best sound.',
    noisy: 'Too noisy here — move somewhere quieter',
    span: 'Pinched and flat were too close — exaggerate them more.',
    leansPinched: 'Your centered note leans pinched',
    leansFlat: 'Your centered note leans flat'
  };
  var STORE_KEY = 'orchestra-sound-test-v2';

  function $(id) { return document.getElementById(id); }
  var a4 = 440;
  try { var sv = JSON.parse(localStorage.getItem('orchestra-drone') || '{}'); if (sv.a4 >= 410 && sv.a4 <= 450) a4 = +sv.a4; } catch (e) {}
  function target() { return TARGET_HZ * a4 / 440; }

  // ---------- FFT (radix-2, in place) ----------
  var fftCache = {};
  function fft(re, im) {
    var n = re.length, i, j, k, m;
    var t = fftCache[n];
    if (!t) {
      var cs = new Float64Array(n / 2), sn = new Float64Array(n / 2);
      for (i = 0; i < n / 2; i++) { cs[i] = Math.cos(2 * Math.PI * i / n); sn[i] = -Math.sin(2 * Math.PI * i / n); }
      var rev = new Uint32Array(n), bits = Math.round(Math.log2(n));
      for (i = 0; i < n; i++) { var r = 0; for (j = 0; j < bits; j++) if (i & (1 << j)) r |= 1 << (bits - 1 - j); rev[i] = r; }
      t = fftCache[n] = { cs: cs, sn: sn, rev: rev };
    }
    for (i = 0; i < n; i++) { j = t.rev[i]; if (j > i) { var a = re[i]; re[i] = re[j]; re[j] = a; a = im[i]; im[i] = im[j]; im[j] = a; } }
    for (var size = 2; size <= n; size <<= 1) {
      var half = size >> 1, step = n / size;
      for (i = 0; i < n; i += size) {
        for (j = i, k = 0; j < i + half; j++, k += step) {
          m = j + half;
          var tr = re[m] * t.cs[k] - im[m] * t.sn[k], ti = re[m] * t.sn[k] + im[m] * t.cs[k];
          re[m] = re[j] - tr; im[m] = im[j] - ti; re[j] += tr; im[j] += ti;
        }
      }
    }
  }

  function db(x) { return 10 * Math.log10(Math.max(x, 1e-30)); }
  function median(arr) {
    var t = arr.slice().sort(function (p, q) { return p - q; });
    return t[Math.floor(t.length / 2)];
  }
  function clamp(x, lo, hi) { return Math.max(lo, Math.min(hi, x)); }

  // ---------- spectrum + measure ----------
  var hannW = null, fre, fim, Sraw, Ssub;
  // Hann window + zero-padded FFT of buf into Sraw (power). Returns level in dBFS (RMS).
  function spectrum(buf) {
    var n = buf.length, N = n * PAD_FACTOR, i;
    if (!hannW || hannW.length !== n) {
      hannW = new Float64Array(n);
      for (i = 0; i < n; i++) hannW[i] = 0.5 - 0.5 * Math.cos(2 * Math.PI * i / (n - 1));
      fre = new Float64Array(N); fim = new Float64Array(N);
      Sraw = new Float64Array(N / 2); Ssub = new Float64Array(N / 2);
    }
    var ss = 0;
    for (i = 0; i < n; i++) { ss += buf[i] * buf[i]; fre[i] = buf[i] * hannW[i]; }
    fre.fill(0, n); fim.fill(0);
    fft(fre, fim);
    for (i = 0; i < N / 2; i++) Sraw[i] = fre[i] * fre[i] + fim[i] * fim[i];
    return 10 * Math.log10(Math.max(ss / n, 1e-18));
  }

  // Features from the spectrum already in Sraw. noise = average noise power spectrum or null.
  function measure(sr, level, tg, noise, noiseLvl) {
    var half = Sraw.length, df = sr / (half * 2), i, k;
    var minLevel = Math.max(LEVEL_MIN_DBFS, noise && noiseLvl !== null ? noiseLvl + NOISE_MARGIN_DB : -1e9);
    if (level < minLevel) return { ok: false, level: level, why: 'Too quiet. Play louder or hold the phone closer.' };
    function bin(f) { return clamp(Math.round(f / df), 0, half - 1); }
    var S = Sraw;
    if (noise && noise.length === half) { for (i = 0; i < half; i++) Ssub[i] = Math.max(Sraw[i] - noise[i], 0); S = Ssub; }
    function sum(lo, hi) { var t = 0; for (var b = bin(lo); b <= bin(hi); b++) t += S[b]; return t; }
    function mx(lo, hi) { var t = 0; for (var b = bin(lo); b <= bin(hi); b++) if (S[b] > t) t = S[b]; return t; }

    // f0 = largest peak within +-PEAK_RANGE_CENTS of the target (no YIN: flat sounds can lose the fundamental to an octave jump)
    var lo = bin(tg * Math.pow(2, -PEAK_RANGE_CENTS / 1200)), hi = bin(tg * Math.pow(2, PEAK_RANGE_CENTS / 1200));
    var best = lo;
    for (i = lo; i <= hi; i++) if (S[i] > S[best]) best = i;
    var fp = best * df;
    var around = Sraw.slice(bin(fp - LOCAL_HALF_HZ), bin(fp + LOCAL_HALF_HZ) + 1);
    var med = median(Array.prototype.slice.call(around));
    if (!(S[best] > 0) || db(Sraw[best] / Math.max(med, 1e-30)) < PEAK_PROM_DB) {
      return { ok: false, level: level, why: 'Not hearing written G (' + Math.round(tg) + ' Hz).' };
    }
    var f0 = fp;
    var h = [0];
    for (k = 1; k <= 5; k++) h.push(mx((1 - HK_BAND) * k * f0, (1 + HK_BAND) * k * f0));
    var h1 = Math.max(h[1], 1e-30);
    return {
      ok: true, f0: f0, level: level, cents: 1200 * Math.log2(f0 / tg),
      fund: db(sum((1 - FUND_BAND) * f0, (1 + FUND_BAND) * f0) / Math.max(sum(TOT_LO, TOT_HI), 1e-30)),
      h2: db(h[2] / h1), h3: db(h[3] / h1), h4: db(h[4] / h1), h5: db(h[5] / h1)
    };
  }
  function analyze(buf, sr, aRef, noise, noiseLvl) {
    var level = spectrum(buf);
    return measure(sr, level, TARGET_HZ * aRef / 440, noise || null, noiseLvl === undefined ? null : noiseLvl);
  }

  // ---------- pure helpers (also used by tests) ----------
  function posOf(x, P, F) { return (x - F) / (P - F); }
  function spanTooSmall(P, F) { return P - F < MIN_SPAN; }
  function centerCheck(P, F, C) {
    var pos = posOf(C, P, F);
    return { pos: pos, status: pos > CENTER_OK_HI ? 'pinched' : pos < CENTER_OK_LO ? 'flat' : 'ok' };
  }
  function rawState(pos, center) {
    return pos < center - CENTER_ZONE ? 'flat' : pos > center + CENTER_ZONE ? 'pinched' : 'centered';
  }
  function newWord() { return { shown: null, cand: null, since: 0 }; }
  function wordStep(w, raw, now) {   // the word changes only after the new state has held WORD_HOLD seconds
    if (raw === w.shown) { w.cand = null; return w.shown; }
    if (raw !== w.cand) { w.cand = raw; w.since = now; }
    else if (now - w.since >= WORD_HOLD * 1000) { w.shown = raw; w.cand = null; }
    return w.shown;
  }
  function steadyMedian(vals) {      // median over the steadiest STEADY_S stretch
    var best = null, last = vals[vals.length - 1].t;
    for (var i = 0; i < vals.length; i++) {
      if (last - vals[i].t < STEADY_S * 1000 - 150) break;
      var w = [];
      for (var j = i; j < vals.length && vals[j].t - vals[i].t <= STEADY_S * 1000; j++) w.push(vals[j].v);
      var spread = Math.max.apply(null, w) - Math.min.apply(null, w);
      if (!best || spread < best.spread) best = { spread: spread, med: median(w) };
    }
    return best ? best.med : median(vals.map(function (x) { return x.v; }));
  }
  var FEATS = ['cents', 'level', 'fund', 'h2', 'h3', 'h4', 'h5'];
  function medianOf(list) {
    var o = {};
    FEATS.forEach(function (k) { o[k] = median(list.map(function (r) { return r[k]; })); });
    o.f0 = median(list.map(function (r) { return r.f0; }));
    return o;
  }

  // ---------- session state ----------
  var phase = 'idle';              // idle | cal | practice
  var cal = null;                  // { step, t0, vals, lastValid, P, F, C, center }
  var noise = null, noiseLevel = null, noiseAcc = null, noiseN = 0, noiseMs = 0;
  var recent = [], noteReadings = [], holdStart = 0, lastGood = 0, word = newWord(), pending = null;
  var listening = false, ctx, analyser, stream, buf, timer = 0;

  function fmt(x, d) { return (x >= 0 ? '+' : '−') + Math.abs(x).toFixed(d === undefined ? 1 : d); }
  function resetNote() { recent = []; noteReadings = []; holdStart = 0; word = newWord(); }

  function startCal(now) {
    noise = null; noiseLevel = null;
    cal = { step: 'silent', t0: now, vals: [], lastValid: 0, P: null, F: null, C: null, center: null };
    phase = 'cal'; resetNote();
    startStep('silent', now);
  }
  function startStep(name, now) {
    cal.step = name; cal.t0 = now; cal.vals = []; cal.lastValid = 0; recent = [];
    if (name === 'silent') { noiseAcc = null; noiseN = 0; noiseMs = 0; }
    renderCal(0, now);
  }

  function smooth(r) {
    recent.push(r); if (recent.length > SMOOTH_N) recent.shift();
    return medianOf(recent);
  }

  // one analysis step; buf = latest WINDOW samples, now = ms
  function process(b, sr, now) {
    var level = spectrum(b);
    $('dLevel').textContent = level.toFixed(1);
    if (phase === 'cal') calTick(sr, level, now); else if (phase === 'practice') pracTick(sr, level, now);
  }

  function calTick(sr, level, now) {
    var step = cal.step, el = now - cal.t0;
    if (step === 'silent') {
      if (el >= FLUSH_S * 1000) {
        if (!noiseAcc) noiseAcc = new Float64Array(Sraw.length);
        for (var i = 0; i < Sraw.length; i++) noiseAcc[i] += Sraw[i];
        noiseN++; noiseMs += Math.pow(10, level / 10);
      }
      var prog = clamp((el / 1000 - FLUSH_S) / SILENT_S, 0, 1);
      renderCal(prog, now);
      if (prog >= 1 && noiseN > 0) {
        noise = noiseAcc; for (var k = 0; k < noise.length; k++) noise[k] /= noiseN;
        noiseLevel = db(noiseMs / noiseN);
        $('dNoise').textContent = noiseLevel.toFixed(1);
        if (noiseLevel > NOISE_MAX_DBFS) startStep('noisy', now); else startStep('pinched', now);
      }
      return;
    }
    if (step !== 'pinched' && step !== 'flat' && step !== 'centered') return;   // waiting on a button
    if (el < FLUSH_S * 1000) { renderCal(0, now); return; }
    var m = measure(sr, level, target(), noise, noiseLevel);
    if (!m.ok) {
      if (cal.vals.length && now - cal.lastValid > HOLD_GRACE_MS) { cal.vals = []; recent = []; }
      $('msg').textContent = 'Level ' + level.toFixed(0) + ' dBFS. ' + m.why;
      renderCal(cal.vals.length ? (now - cal.vals[0].t) / 1000 / HOLD_S : 0, now);
      return;
    }
    var sm = smooth(m);
    cal.lastValid = now; cal.vals.push({ t: now, v: sm.fund });
    $('msg').textContent = 'Level ' + level.toFixed(0) + ' dBFS. Hearing ' + Math.round(m.f0) + ' Hz.';
    $('dFund').textContent = fmt(sm.fund); $('dCents').textContent = fmt(sm.cents, 0);
    var p = (now - cal.vals[0].t) / 1000 / HOLD_S;
    renderCal(Math.min(p, 1), now);
    if (p >= 1) finishStep(steadyMedian(cal.vals), now);
  }

  function finishStep(v, now) {
    var step = cal.step;
    if (step === 'pinched') { cal.P = v; startStep('flat', now); }
    else if (step === 'flat') {
      cal.F = v;
      if (spanTooSmall(cal.P, cal.F)) startStep('span', now); else startStep('centered', now);
    } else if (step === 'centered') {
      cal.C = v;
      var c = centerCheck(cal.P, cal.F, cal.C);
      if (c.status === 'ok') acceptCal(now);
      else startStep(c.status === 'pinched' ? 'leansPinched' : 'leansFlat', now);
    }
    updateCalDetails();
  }
  function acceptCal(now) {
    cal.center = posOf(cal.C, cal.P, cal.F);
    phase = 'practice'; resetNote();
    var lo = (cal.center - CENTER_ZONE - NEEDLE_MIN) / (NEEDLE_MAX - NEEDLE_MIN), hi = (cal.center + CENTER_ZONE - NEEDLE_MIN) / (NEEDLE_MAX - NEEDLE_MIN);
    lo = clamp(lo, 0, 1); hi = clamp(hi, 0, 1);
    $('band').style.left = lo * 100 + '%'; $('band').style.width = (hi - lo) * 100 + '%';
    updateCalDetails(); showView(); renderPractice(null);
  }
  function updateCalDetails() {
    $('dP').textContent = cal && cal.P !== null ? fmt(cal.P) : '–';
    $('dF').textContent = cal && cal.F !== null ? fmt(cal.F) : '–';
    $('dC').textContent = cal && cal.C !== null ? fmt(cal.C) + (cal.center !== null ? ' (pos ' + cal.center.toFixed(2) + ')' : '') : '–';
  }

  function pracTick(sr, level, now) {
    var m = measure(sr, level, target(), noise, noiseLevel);
    if (!m.ok) {
      if (holdStart && now - lastGood > HOLD_GRACE_MS) resetNote();
      $('msg').textContent = 'Level ' + level.toFixed(0) + ' dBFS. ' + m.why;
      if (!holdStart) renderPractice(null);
      return;
    }
    lastGood = now; if (!holdStart) holdStart = now;
    var sm = smooth(m);
    noteReadings.push(sm);
    var pos = posOf(sm.fund, cal.P, cal.F);
    wordStep(word, rawState(pos, cal.center), now);
    $('msg').textContent = 'Level ' + level.toFixed(0) + ' dBFS. Hearing ' + Math.round(m.f0) + ' Hz.';
    renderPractice({ pos: pos, fund: sm.fund, cents: sm.cents, level: sm.level });
  }

  // ---------- rendering ----------
  function showView() {
    $('calBox').hidden = phase === 'practice';
    $('prac').hidden = phase !== 'practice';
    $('recal').disabled = !listening;
  }
  function renderCal(prog, now) {
    showView();
    var step = cal ? cal.step : 'idle';
    $('calText').textContent = TXT[step] || '';
    $('holdFill').style.width = clamp(prog, 0, 1) * 100 + '%';
    var sub = '';
    if (step === 'silent') sub = 'Step 1 of 4';
    else if (step === 'pinched') sub = 'Step 2 of 4. Hold it for ' + HOLD_S + ' seconds.';
    else if (step === 'flat') sub = 'Step 3 of 4. Hold it for ' + HOLD_S + ' seconds.';
    else if (step === 'centered') sub = 'Step 4 of 4. Hold it for ' + HOLD_S + ' seconds.';
    $('calSub').textContent = sub;
    var btns = '';
    if (step === 'noisy') btns = '<button class="btn main" data-act="silent">Try again</button>';
    else if (step === 'span') btns = '<button class="btn main" data-act="pinched">Try again</button>';
    else if (step === 'leansPinched' || step === 'leansFlat') btns = '<button class="btn main" data-act="center">Try again</button><button class="btn" data-act="use">Use it anyway</button>';
    if ($('calBtns').dataset.s !== step) { $('calBtns').innerHTML = btns; $('calBtns').dataset.s = step; }
  }
  function renderPractice(m) {
    var vEl = $('verdict');
    if (!m) {
      $('needle').style.opacity = '.25'; vEl.textContent = ''; vEl.className = 'big'; $('cents').textContent = '';
      $('save').disabled = true; return;
    }
    var pct = clamp((m.pos - NEEDLE_MIN) / (NEEDLE_MAX - NEEDLE_MIN), 0, 1) * 100;
    $('needle').style.opacity = '1'; $('needle').style.left = pct + '%';
    $('meter').setAttribute('aria-valuenow', Math.round(pct));
    $('cents').textContent = fmt(m.cents, 0) + ' cents';
    $('dFund').textContent = fmt(m.fund); $('dPos').textContent = m.pos.toFixed(2); $('dCents').textContent = fmt(m.cents, 0);
    if (word.shown) {
      vEl.textContent = WORDS[word.shown]; vEl.className = 'big ' + (word.shown === 'centered' ? 'v-ok' : 'v-warn');
    } else { vEl.textContent = '…'; vEl.className = 'big'; }
    $('save').disabled = !word.shown;
  }

  $('calBtns').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b || !cal) return;
    var now = performance.now(), a = b.dataset.act;
    if (a === 'silent') startStep('silent', now);
    else if (a === 'pinched') startStep('pinched', now);
    else if (a === 'center') startStep('centered', now);
    else if (a === 'use') acceptCal(now);
  });

  // ---------- microphone ----------
  function tick() {
    if (!listening) return;
    var now = performance.now();
    try {
      if (ctx.state !== 'running') ctx.resume();
      analyser.getFloatTimeDomainData(buf);
      var flat = true; for (var q = 0; q < buf.length; q += 64) if (buf[q] !== 0) { flat = false; break; }
      if (flat) { $('msg').textContent = 'No audio from the mic yet (' + ctx.state + ').'; return; }
      process(buf, ctx.sampleRate, now);
    } catch (e) { $('msg').textContent = 'Error: ' + e.message; }
  }
  function start() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { $('msg').textContent = 'This browser cannot reach the microphone. Open this page over https.'; return; }
    try { if (navigator.audioSession) navigator.audioSession.type = 'play-and-record'; } catch (e) {}
    var AC = window.AudioContext || window.webkitAudioContext;
    ctx = new AC();            // created inside the tap so iOS lets it run
    try { ctx.resume(); } catch (e) {}
    navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } }).then(function (st) {
      stream = st;
      var src = ctx.createMediaStreamSource(st);
      analyser = ctx.createAnalyser();
      analyser.fftSize = WINDOW;
      analyser.smoothingTimeConstant = 0;
      buf = new Float32Array(WINDOW);
      src.connect(analyser);
      var mute = ctx.createGain(); mute.gain.value = 0;   // silent output keeps Safari pulling the mic
      analyser.connect(mute); mute.connect(ctx.destination);
      ctx.resume();
      try {
        var gs = st.getAudioTracks()[0].getSettings();
        var bad = [];
        if (gs.autoGainControl) bad.push('auto gain');
        if (gs.noiseSuppression) bad.push('noise suppression');
        if (gs.echoCancellation) bad.push('echo cancellation');
        var n = $('agcNote');
        n.hidden = !bad.length;
        n.textContent = bad.length ? 'This browser left ' + bad.join(' and ') + ' on. Readings may be off.' : '';
      } catch (e) {}
      listening = true;
      $('go').textContent = 'Stop listening'; $('go').setAttribute('aria-pressed', 'true');
      $('msg').textContent = 'Listening…';
      startCal(performance.now());
      timer = setInterval(tick, ANALYSIS_MS);
    }).catch(function (e) { if (ctx) { ctx.close(); ctx = null; } $('msg').textContent = 'Microphone problem: ' + (e && e.name ? e.name : e); });
  }
  function stop() {
    listening = false; clearInterval(timer);
    if (stream) stream.getTracks().forEach(function (t) { t.stop(); });
    if (ctx) ctx.close();
    phase = 'idle'; cal = null; resetNote(); showView(); renderCal(0, 0);
    $('go').textContent = 'Start listening'; $('go').setAttribute('aria-pressed', 'false');
    $('msg').textContent = '';
  }
  $('go').addEventListener('click', function () { listening ? stop() : start(); });
  $('recal').addEventListener('click', function () { if (listening) { $('calBtns').dataset.s = ''; startCal(performance.now()); } });

  // ---------- reference A ----------
  function markRef() {
    Array.prototype.forEach.call($('refSeg').children, function (b) { b.setAttribute('aria-pressed', String(+b.dataset.v === a4)); });
  }
  $('refSeg').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    a4 = +b.dataset.v; markRef(); resetNote();
  });
  markRef();

  // ---------- saved notes ----------
  var saved = [];
  try { saved = JSON.parse(localStorage.getItem(STORE_KEY) || '[]'); } catch (e) {}
  function persist() { try { localStorage.setItem(STORE_KEY, JSON.stringify(saved)); } catch (e) {} }
  var COLS = ['time', 'label', 'verdict', 'fund_share', 'pos', 'cents', 'level', 'h2_rel', 'h3_rel', 'h4_rel', 'h5_rel', 'P', 'F', 'C', 'center'];
  function row(n) { return [n.time, n.label, n.verdict, n.fund, n.pos, n.cents, n.level, n.h2, n.h3, n.h4, n.h5, n.P, n.F, n.C, n.center]; }
  function csv() {
    var lines = [COLS.join(',')];
    saved.forEach(function (n) { lines.push(row(n).map(function (v) { return typeof v === 'number' ? v.toFixed(2) : '"' + String(v).replace(/"/g, '""') + '"'; }).join(',')); });
    return lines.join('\n');
  }
  function renderTable() {
    var tb = $('tbl').tBodies[0];
    tb.innerHTML = '';
    saved.forEach(function (n, i) {
      var tr = document.createElement('tr');
      [i + 1, n.label || '–', n.verdict, n.fund.toFixed(1), n.pos.toFixed(2), n.cents.toFixed(0), n.level.toFixed(0)].forEach(function (v) {
        var td = document.createElement('td'); td.textContent = v; tr.appendChild(td);
      });
      tb.appendChild(tr);
    });
  }
  $('save').addEventListener('click', function () {
    if (!noteReadings.length || !cal || cal.center === null) return;
    var m = medianOf(noteReadings);
    pending = { time: new Date().toISOString(), label: '', verdict: word.shown ? WORDS[word.shown] : '', fund: m.fund, pos: posOf(m.fund, cal.P, cal.F), cents: m.cents, level: m.level,
      h2: m.h2, h3: m.h3, h4: m.h4, h5: m.h5, P: cal.P, F: cal.F, C: cal.C, center: cal.center };
    saved.push(pending); persist(); renderTable();
    $('ask').hidden = false;
  });
  $('labels').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b || !pending) return;
    pending.label = b.dataset.l; persist(); renderTable();
    pending = null; $('ask').hidden = true;
  });
  $('copy').addEventListener('click', function () {
    var t = csv();
    var done = function () { $('msg').textContent = 'Copied ' + saved.length + ' notes.'; };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(done, function () { $('msg').textContent = 'Copy blocked. Use Download CSV.'; });
    else $('msg').textContent = 'Copy not available. Use Download CSV.';
  });
  $('dl').addEventListener('click', function () {
    var a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([csv()], { type: 'text/csv' }));
    a.download = 'sound-test.csv';
    document.body.appendChild(a); a.click(); a.remove();
  });
  var clearArmed = 0;
  $('clear').addEventListener('click', function () {
    if (!clearArmed) { clearArmed = 1; $('clear').textContent = 'Tap again to clear'; setTimeout(function () { clearArmed = 0; $('clear').textContent = 'Clear'; }, 3000); return; }
    saved = []; persist(); renderTable(); $('ask').hidden = true; pending = null; clearArmed = 0; $('clear').textContent = 'Clear';
  });
  renderTable(); renderCal(0, 0);

  // stale-cache check: if the server has a newer sound.html, reload it
  try {
    fetch(location.pathname + '?x=' + Date.now(), { cache: 'no-store' }).then(function (r) { return r.text(); }).then(function (t) {
      var m = t.match(/var VERSION = '(v\w+)'/);
      if (m && m[1] !== VERSION && location.search.indexOf('v=' + m[1]) < 0) location.replace(location.pathname + '?v=' + m[1]);
    }).catch(function () {});
  } catch (e) {}

  // hooks for tests
  window.__sound = {
    analyze: analyze, TARGET_HZ: TARGET_HZ, WINDOW: WINDOW, posOf: posOf, spanTooSmall: spanTooSmall, centerCheck: centerCheck,
    newWord: newWord, wordStep: wordStep, MIN_SPAN: MIN_SPAN, WORD_HOLD: WORD_HOLD,
    testStart: function (now) { listening = true; startCal(now); },
    process: process,
    state: function () { return { phase: phase, step: cal && cal.step, P: cal && cal.P, F: cal && cal.F, C: cal && cal.C, center: cal && cal.center, word: word.shown, text: $('calText').textContent, verdict: $('verdict').textContent }; },
    demo: function (pos) {
      listening = true; cal = { P: -2, F: -19, C: -10, center: 0.5, step: 'x' }; phase = 'practice'; word.shown = 'flat'; acceptCal(0); word.shown = 'flat';
      renderPractice({ pos: pos, fund: -12, cents: 4, level: -20 });
    }
  };
})();
</script>
</body>
</html>
